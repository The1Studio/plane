name: Deploy staging (self-hosted)

# Staging counterpart to deploy-master.yml. Same runner, same script, same
# Discord step — everything environment-specific rides in as an env var
# (see deployments/selfhost/deploy.sh's header for the four-variable contract).
#
# Staging is an integration branch: features merge here first, then promote to
# master by PR. Its history is DISPOSABLE — after every upstream rebase on
# master it is hard-reset to master and open features are re-merged. See
# docs/FORK.md § "Rebase-on-tags workflow" step 9.

on:
  push:
    branches: [staging]
    # Chỉ deploy khi có thay đổi liên quan tới app/build (bỏ qua thay đổi docs thuần)
    #
    # GOTCHA — creating `staging` at an ALREADY-PUSHED commit does not trigger
    # this. A new ref pointing at an existing commit produces a push event with
    # zero commits, so a path filter has no changed files to match and the run
    # is skipped silently — no run record, not even a skipped one, and the
    # workflow never registers. Observed 2026-08-26 when `staging` was branched
    # from an already-pushed feat/ branch.
    #
    # Recovery: push one real commit touching a non-ignored path. The post-rebase
    # reset in docs/FORK.md step 9 is NOT affected — it force-pushes master's
    # commits onto staging, which is a normal push with commits.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy to staging (branch, tag, or SHA)'
        required: false
        default: 'staging'

# A SEPARATE group from production's `deploy-master`. Sharing one would let a
# staging deploy queue behind or cancel a production deploy at the workflow
# level, on top of the runner-level serialization that already exists (there is
# a single sv-0 runner). cancel-in-progress stays false: a deploy halfway
# through `docker compose up` must never be killed.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Runner tự host trên server, gắn label 'sv-0' — same machine as production.
    runs-on: [self-hosted, sv-0]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch can target any ref — that is what makes staging
          # useful for validating a rebase candidate without force-pushing the
          # branch first. A push event falls through to github.ref.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build images & deploy
        id: deploy
        env:
          RUN_DIR: /opt/plane-staging-app
          IMAGE_TAG: staging
          HEALTH_HTTP_PORT: '81'
          COMPOSE_PROJECT: plane-staging-app
          # Staging DOES use the bundled services — that is the whole point of
          # its isolation. pg17 matches production's Neon server version
          # (17.11), so a migration rehearsed here meets the same major version
          # it will meet in production.
          LOCAL_DB: '1'
          LOCAL_STORAGE: '1'
          PG_IMAGE: pgvector/pgvector:pg17
        run: bash deployments/selfhost/deploy.sh

      # Post-deploy smoke. Lives HERE, not in master-ci, because staging only
      # reflects a commit AFTER this deploy finishes — a smoke job in master-ci
      # runs at PR/push time and would test whatever was previously deployed.
      #
      # deploy.sh already gates on localhost web+api returning 200. These are the
      # things it cannot see:
      #   1. the public path through the Cloudflare tunnel (it only probes localhost)
      #   2. whether the running containers are actually THIS commit's images,
      #      which is what catches a silently no-op deploy
      #   3. whether the API can really answer, rather than just terminate a TCP
      #      connection with a 200
      - name: Smoke — staging
        id: smoke
        env:
          PUBLIC_URL: https://plane-staging.the1studio.org
          LOCAL_URL: http://localhost:81
          COMPOSE_PROJECT: plane-staging-app
        run: |
          set -euo pipefail
          fail=0
          SHORT_SHA="$(git rev-parse --short HEAD)"

          echo "== 1. public URL through the tunnel =="
          code="$(curl -s -o /tmp/smoke_public -w '%{http_code}' -L --max-time 30 "$PUBLIC_URL/" || echo 000)"
          if [ "$code" = "200" ]; then echo "   ok   $PUBLIC_URL -> 200"
          else echo "   FAIL $PUBLIC_URL -> $code (tunnel/ingress, not the stack — localhost passed)"; fail=1; fi

          echo "== 2. API answers with real JSON =="
          code="$(curl -s -o /tmp/smoke_api -w '%{http_code}' --max-time 30 "$LOCAL_URL/api/instances/" || echo 000)"
          if [ "$code" = "200" ] && python3 -c 'import json,sys; json.load(open("/tmp/smoke_api"))' 2>/dev/null; then
            echo "   ok   /api/instances/ -> 200, parseable JSON"
          else
            echo "   FAIL /api/instances/ -> $code, body not valid JSON"; head -c 300 /tmp/smoke_api || true; fail=1
          fi

          echo "== 3. running containers are THIS commit ($SHORT_SHA) =="
          for svc in api web; do
            cid="$(docker ps -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT" \
                                --filter "label=com.docker.compose.service=$svc")"
            if [ -z "$cid" ]; then echo "   FAIL $svc not running"; fail=1; continue; fi
            img="$(docker inspect "$cid" --format '{{.Config.Image}}')"
            repo="${img%%:*}"
            if docker image inspect "${repo}:git-${SHORT_SHA}" >/dev/null 2>&1 &&
               [ "$(docker image inspect "$img" --format '{{.Id}}')" = "$(docker image inspect "${repo}:git-${SHORT_SHA}" --format '{{.Id}}')" ]; then
              echo "   ok   $svc running $img == ${repo}:git-${SHORT_SHA}"
            else
              echo "   FAIL $svc running $img, which is NOT this commit's build (git-${SHORT_SHA}) — deploy was a no-op"; fail=1
            fi
          done

          [ "$fail" = "0" ] && echo "== smoke PASSED ==" || { echo "== smoke FAILED =="; exit 1; }

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Same thread as production; ENV_LABEL is what distinguishes them.
          DISCORD_THREAD_ID: '1524317964160204800'
          ENV_LABEL: staging
          SITE_URL: https://plane-staging.the1studio.org
          # Both must pass, or the embed would report success on a failed smoke.
          DEPLOY_OUTCOME: ${{ (steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success') && 'success' || 'failure' }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.event.inputs.ref || github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_EVENT: ${{ github.event_name }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash deployments/selfhost/notify-discord.sh
