name: Deploy company-main (self-hosted)

on:
  push:
    branches: [company-main]
    # Chỉ deploy khi có thay đổi liên quan tới app/build (bỏ qua thay đổi docs thuần)
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-company-main
  cancel-in-progress: false

jobs:
  deploy:
    # Runner tự host trên server, gắn label 'sv-0'
    runs-on: [self-hosted, sv-0]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images & deploy
        id: deploy
        env:
          RUN_DIR: /opt/plane-fork-app
          IMAGE_TAG: companymain
        run: bash deployments/selfhost/deploy.sh

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: '1524317964160204800'
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_EVENT: ${{ github.event_name }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash deployments/selfhost/notify-discord.sh
