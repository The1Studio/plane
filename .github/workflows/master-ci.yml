# CI gate for The1Studio's master fork branch.
# Purpose: fail fast on any rebase that silently breaks the fork — missing migrations,
# Django system errors, frontend type-check failures, or frontend unit-test failures.
#
# This workflow is REQUIRED on master and must never carry a `paths:` filter
# (per ci-cd-trigger-design rule §3: path-filtered required-check workflows cause
# permanent "Expected — Waiting" → merge deadlock).

name: master CI

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Backend isolation check
  # Verifies that:
  #   (a) no migration was added or removed during the rebase without a matching
  #       migration file (makemigrations --check --dry-run exits non-zero if so)
  #   (b) Django's system check passes (import errors, url resolver errors, etc.)
  # ---------------------------------------------------------------------------
  backend-isolation-check:
    name: Backend — migration check + Django system check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: plane
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Minimal env to satisfy Django settings imports — not used in real deploys
      DATABASE_URL: postgresql://plane:plane_ci@localhost:5432/plane
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-real-secret-key-generated-for-tests-only
      DJANGO_SETTINGS_MODULE: plane.settings.test
      # LLM keys — placeholders, not real; CI only checks imports + migrations
      LLM_PROVIDER: anthropic
      LLM_API_KEY: sk-ci-placeholder
      LLM_MODEL: claude-sonnet-4-6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements/base.txt

      - name: Install Python dependencies
        working-directory: apps/api
        run: pip install -r requirements/base.txt
        timeout-minutes: 5

      - name: Django system check
        working-directory: apps/api
        run: python manage.py check
        # Standard system check: exits non-zero on any model/app/settings error.
        # This is the gate that fires when a rebase onto a new upstream tag breaks
        # app loading or the documented touch-point appends. (Deployment-security
        # warnings belong to the prod settings profile, not this CI check.)
        timeout-minutes: 3

      - name: Migration completeness check
        working-directory: apps/api
        run: python manage.py makemigrations --check --dry-run
        # Exits 1 if any app has pending model changes without a corresponding migration file.
        # This fires when a rebase onto a new upstream tag adds/removes model fields and the
        # migration file is missing or the cross-app FK pin is stale.
        timeout-minutes: 5

  # ---------------------------------------------------------------------------
  # Job 2 — Frontend type-check
  # Verifies pnpm lockfile integrity and TypeScript compilation after a rebase.
  # ---------------------------------------------------------------------------
  frontend-check:
    name: Frontend — lockfile + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        # No `version:` input — pnpm/action-setup reads the repo's
        # `packageManager` field (pnpm@10.32.1). Pinning a different version
        # here triggers ERR_PNPM_BAD_PM_VERSION (version-mismatch) and the
        # self-installer fails before any install runs.
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
        # --frozen-lockfile fails if pnpm-lock.yaml is out of sync with package.json.
        # This catches the case where a rebase introduced a package.json change but
        # the lockfile was not regenerated.
        timeout-minutes: 5

      - name: Type-check
        run: pnpm check
        # Runs TypeScript compiler across all workspace packages.
        # Catches type errors introduced by the rebase (e.g. upstream API shape changes).
        timeout-minutes: 5

      - name: Unit tests (vitest, all packages)
        run: pnpm turbo run test
        # Every package/app with a `test` script (vitest) — currently
        # packages/cascade-ext, packages/codemods, packages/workload-ext,
        # apps/live. The `test` turbo task depends on `^build`, so this also
        # builds each package's dependencies first (e.g. apps/live's tests
        # need @plane/editor built, not just type-checked, to resolve).
        # Was previously ungated: cascade-ext's and workload-ext's suites
        # could go red on master and nothing here would notice.
        # See The1Studio/plane#65.
        timeout-minutes: 10

      - name: Web build (SSR prerender)
        run: pnpm turbo run build --filter=web
        # This is the SAME command the deploy workflow runs, and it is the ONLY
        # check here that executes application code. Type-check cannot replace
        # it: `react-router build` prerenders in SPA mode, which CONSTRUCTS the
        # MobX RootStore tree at build time, so a store that throws during
        # construction fails here and nowhere else.
        #
        # Added after PR #37 merged green and immediately broke the deploy
        # (run 32141644769): CalendarStore read `workSettingsStore` during
        # `super()`, five lines before RootStore assigned it. The field is
        # declared non-optional, so `tsc` was perfectly happy — the bug only
        # exists in a construction window the type system does not model.
        # Before this step, `turbo run build --filter=web` lived solely in
        # deploy-master.yml, which runs on push AFTER merge, so this
        # entire class of failure was structurally invisible to PR CI.
        timeout-minutes: 10

  # ---------------------------------------------------------------------------
  # Job 3 — Backend pytest suite (fork-owned apps)
  # Runs the actual Python test suite for The1Studio's fork-owned Django apps.
  # Job 1 above only checks that the apps IMPORT cleanly and that migrations
  # are complete — it never executes a single test. This job is the real
  # regression gate for fork-app behavior (hundreds of tests previously never
  # gated a PR — see PR #14, which merged 47 github_ext tests only because a
  # human ran pytest by hand).
  #
  # The app list is DERIVED, never hardcoded. It used to be spelled out here,
  # which meant a newly scaffolded app's tests silently never ran and the job
  # went green while covering none of it — the same failure as PR #14, and it
  # recurred with project_ext (PR #25). plane-fork-test-paths.py intersects the
  # `forkApps` registry in .claude/skills/_shared/references/fork-convention.md
  # with the tests/ directories actually on disk, and hard-fails on drift, so
  # registering a new app is the single action that makes it both classified
  # and tested.
  #
  # Scope: fork-owned apps ONLY. Upstream Plane's own test suite is NOT run
  # here — it is not maintained on this fork and would fail for unrelated
  # reasons. That is why this derives from the registry rather than globbing
  # every plane/*/tests directory.
  #
  # KNOWN RED AT INTRODUCTION: plane/ai_ext/tests/test_rag_access.py is
  # broken on master; PR #15 fixes it (16/16 green). Merge #15 FIRST,
  # then this PR. No continue-on-error / `|| true` / app exclusion is used
  # to mask this — a CI job that hides failures is worse than no CI job.
  # ---------------------------------------------------------------------------
  backend-pytest:
    name: Backend — pytest (fork-owned apps)
    runs-on: ubuntu-latest
    # Must stay ABOVE the pytest step's own timeout (25) plus the setup steps
    # that precede it (~12 min of install/service budget), or the job ceiling
    # fires first and the step's more specific message never appears.
    timeout-minutes: 50

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: plane
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # redis:7-alpine — deployment (plane-deploy compose) runs
      # valkey/valkey:7.2.11-alpine, a Redis-protocol-compatible fork. The
      # official redis image is used here instead: its `redis-cli`-based
      # healthcheck is guaranteed present, which is not independently
      # verified for the valkey image from this sandbox. Major version (7)
      # matches the deployment target.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Same minimal env as job 1, plus REDIS_URL is load-bearing here (not
      # just an import-time check) — plane/ai_ext exercises the Django cache
      # backend (django_redis), which needs a real Redis connection.
      DATABASE_URL: postgresql://plane:plane_ci@localhost:5432/plane
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-real-secret-key-generated-for-tests-only
      DJANGO_SETTINGS_MODULE: plane.settings.test
      # github_ext P3 inbound sync dispatches through the real issue-create
      # view, which builds notification/webhook payloads from these URLs.
      # A deployment always sets them; without them the service-token write
      # 500s with "APP_BASE_URL or WEB_URL is not set".
      WEB_URL: http://localhost
      APP_BASE_URL: http://localhost
      # LLM keys — placeholders, not real; tests that touch the LLM client
      # mock it rather than making network calls.
      LLM_PROVIDER: anthropic
      LLM_API_KEY: sk-ci-placeholder
      LLM_MODEL: claude-sonnet-4-6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements/base.txt
            apps/api/requirements/test.txt

      - name: Install Python dependencies
        working-directory: apps/api
        # requirements/test.txt pulls in base.txt (`-r base.txt`) plus the
        # pytest/factory-boy/freezegun test toolchain.
        run: pip install -r requirements/test.txt
        timeout-minutes: 8

      - name: Enable pgvector extension on template1
        # plane/ai_ext's VectorField-backed models need the `vector` Postgres
        # type. pytest.ini runs with `--nomigrations`, which builds the test
        # schema via syncdb and SKIPS the migration that would normally run
        # `CREATE EXTENSION vector` — so the extension must be pre-enabled on
        # template1 before pytest-django clones it into test_plane. Mirrors
        # the established local-dev workaround for this same constraint.
        run: |
          PGPASSWORD=plane_ci psql -h localhost -U plane -d template1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
        timeout-minutes: 2

      - name: Resolve fork-owned test paths
        id: fork-test-paths
        # Hard-fails if an app ships tests/ but is missing from `forkApps`, which
        # would otherwise both exclude it here and make plane-classify-path.cjs
        # report its files as `core` violations.
        run: |
          set -euo pipefail
          paths="$(python3 .claude/scripts/plane-fork-test-paths.py)"
          echo "Discovered fork-app suites: $paths"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
        timeout-minutes: 2

      - name: Run backend test suite (fork-owned apps)
        working-directory: apps/api
        run: pytest ${{ steps.fork-test-paths.outputs.paths }}
        # 25, raised from 15 on 2026-08-25. The fork-owned suite is dominated by
        # `TransactionTestCase`, which truncates every table between tests, so
        # its runtime grows roughly linearly with test count and does not
        # parallelise. At 219 tests a healthy runner finishes in ~9 min (#80),
        # but a slow one crossed 15 and killed the step MID-SUITE on a
        # docs-only PR (#81) — a red check that says nothing about the diff is
        # worse than a slow one, because the next person's instinct is to
        # re-run rather than read it.
        #
        # 35, raised from 25 on 2026-08-26 after a run crossed 25 with EVERY
        # test passing (The1Studio/plane#91) — the second timeout kill in two
        # days, on a PR that changed only workflow files and docs.
        #
        # This is the last bump this note sanctions. 22 of the 30 fork test
        # files use TransactionTestCase, which truncates every table between
        # tests; runtime therefore scales with test count and cannot be
        # parallelised away. The real fix is to convert the suites that do not
        # genuinely need cross-transaction visibility to plain TestCase, which
        # rolls back instead of truncating. Do that before raising this again.
        timeout-minutes: 35

  # ---------------------------------------------------------------------------
  # The staging smoke used to live here as a placeholder job that always passed.
  # It has been REMOVED rather than wired up, because master-ci is structurally
  # the wrong place for it: this workflow runs at PR/push time, whereas staging
  # only reflects a commit AFTER deploy-staging.yml finishes deploying it. A
  # smoke job here would test whatever happened to be deployed already — green
  # for reasons unrelated to the change under test, which is exactly what the
  # placeholder was.
  #
  # The real smoke now runs in .github/workflows/deploy-staging.yml, in the same
  # job as the deploy, on the server itself: public URL through the Cloudflare
  # tunnel, an API response that parses as JSON, and a check that the running
  # containers carry THIS commit's images. See deployments/selfhost/README.md.
  # ---------------------------------------------------------------------------
