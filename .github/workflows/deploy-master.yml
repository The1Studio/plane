name: Deploy master (self-hosted)

on:
  push:
    branches: [master]
    # Chỉ deploy khi có thay đổi liên quan tới app/build (bỏ qua thay đổi docs thuần)
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    # Runner tự host trên server, gắn label 'sv-0'
    runs-on: [self-hosted, sv-0]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images & deploy
        id: deploy
        env:
          RUN_DIR: /opt/plane-fork-app
          IMAGE_TAG: companymain
          # Identical to deploy.sh's own defaults — stated explicitly so a future
          # edit to deploy-staging.yml cannot silently diverge from production
          # through a default nobody re-reads.
          HEALTH_HTTP_PORT: '80'
          COMPOSE_PROJECT: plane-fork-app
          # Production uses NEITHER bundled service: DATABASE_URL points at Neon
          # (pg17.11) and uploads go to Cloudflare R2. Both containers were
          # nevertheless still running, holding stale pre-migration copies of
          # real data and ~220MB of RAM. Gating them out stops the containers;
          # the plane-fork-app_pgdata and _uploads volumes are NOT deleted.
          LOCAL_DB: '0'
          LOCAL_STORAGE: '0'
        run: bash deployments/selfhost/deploy.sh

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: '1524317964160204800'
          ENV_LABEL: production
          SITE_URL: https://plane.the1studio.org
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_EVENT: ${{ github.event_name }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash deployments/selfhost/notify-discord.sh
